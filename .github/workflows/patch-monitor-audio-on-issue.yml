name: Patch monitor audio on issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: github.event.issue.title == 'APPLY_MONITOR_AUDIO_FIX'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch src/app.js
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app.js')
          text = path.read_text(encoding='utf-8')

          old_autoplay = """      onAutoplayBlocked: () => {
        ui.fallback.hidden = false;
        ui.playerStatus.textContent =
          'TOCA PARA REPRODUCIR';
        ui.playerCaption.textContent =
          'El navegador bloqueó la reproducción automática.';
        ui.playerAction.textContent = '▶';
        ui.playerAction.hidden = false;
      },"""

          new_autoplay = """      onAutoplayBlocked: () => {
        if (ES_MONITOR) {
          sonidoActivado = false;

          try {
            youtubePlayer?.mute?.();
            youtubePlayer?.playVideo?.();
          } catch (_) {}

          ui.fallback.hidden = true;
          mostrarInvitacionSonido();
          return;
        }

        ui.fallback.hidden = false;
        ui.playerStatus.textContent =
          'TOCA PARA REPRODUCIR';
        ui.playerCaption.textContent =
          'El navegador bloqueó la reproducción automática.';
        ui.playerAction.textContent = '▶';
        ui.playerAction.hidden = false;
      },"""

          if old_autoplay in text:
            text = text.replace(old_autoplay, new_autoplay, 1)

          old_sound = """    try {
      youtubePlayer.unMute?.();
      youtubePlayer.setVolume?.(100);
      youtubePlayer.playVideo?.();

      sonidoActivado = true;
      ocultarInvitacionSonido();
    } catch (error) {"""

          new_sound = """    try {
      const estadoAntes = youtubePlayer.getPlayerState?.();
      const estabaReproduciendo =
        estadoAntes === YT.PlayerState.PLAYING ||
        estadoAntes === YT.PlayerState.BUFFERING;

      youtubePlayer.unMute?.();
      youtubePlayer.setVolume?.(100);

      if (!ES_MONITOR || !estabaReproduciendo) {
        youtubePlayer.playVideo?.();
      }

      sonidoActivado = true;
      ocultarInvitacionSonido();
      ui.fallback.hidden = true;
    } catch (error) {"""

          if old_sound in text:
            text = text.replace(old_sound, new_sound, 1)

          if text == path.read_text(encoding='utf-8'):
            raise SystemExit('No changes applied: expected blocks were not found or already patched.')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js
          git commit -m "Fix monitor audio activation behavior"
          git push

      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "Monitor audio patch applied."
